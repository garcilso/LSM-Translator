<!DOCTYPE html>

<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traductor LSM en Tiempo Real</title>
    <link rel="stylesheet" href="./style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  </head>

  <body>
    <main class="container">
      <header class="topbar">
        <h1>Traductor LSM (Prototipo)</h1>

        <div class="cam-controls">
          <button id="btn-start" type="button">Iniciar Cámara</button>
          <button id="btn-flip" type="button" disabled>Cambiar Cámara</button>
        </div>
      </header>

      <section class="stage-wrap">
        <div class="stage" id="stage">
          <video id="webcam" autoplay playsinline muted></video>

          <canvas id="overlay"></canvas>

          <div id="status-badge" class="badge">Cargando modelo de manos...</div>
        </div>

        <div class="hud">
          <div class="pred-box">
            <span class="label-muted">Seña detectada</span>

            <div id="pred-label" class="pred-letter">—</div>
            <div id="pred-conf" class="pred-conf">Confianza: 0%</div>

            <div class="progress-track">
              <div id="hold-bar" class="progress-fill"></div>
            </div>

            <small>Mantén la seña fija por 1s para agregarla</small>
            <br>
            <small id="guess-label"></small>
          </div>

          <div class="output-box">
            <label for="output-text" class="label-muted">Texto traducido</label>

            <textarea id="output-text" rows="4" placeholder="Output..."></textarea>

            <div class="action-row">
              <button id="btn-space" type="button">Espacio</button>
              <button id="btn-back" type="button">Borrar</button>
              <button id="btn-clear" type="button">Limpiar</button>
              <button id="btn-speak" class="primary" type="button">Hablar (es-MX)</button>
            </div>
          </div>
        </div>
      </section>

      <section class="trainer">
        <h2>Entrenador Rápido de Señas LSM</h2>

        <p class="hint">
          Elige una letra estática (o agrega una palabra)
        </p>

        <div class="trainer-controls">
          <select id="class-select"></select>
          <input id="custom-class" type="text" placeholder="Palabra" maxlength="20" />
          <button id="btn-add-class" type="button">+ Agregar Clase</button>
          <button id="btn-record" class="primary" type="button" disabled>Grabar Muestras</button>
        </div>

        <div class="io-row">
          <button id="btn-export" type="button">Exportar JSON</button>

          <label class="file-btn">
            Importar JSON
            <input id="input-import" type="file" accept=".json,application/json" hidden />
          </label>
          
          <button class="btn-delete" id="btn-delete-class" type="button">Borrar Clase Actual</button>
          <button class="btn-reset" id="btn-reset-all" type="button">Borrar Todo</button>
        </div>

        <div id="counts-grid" class="counts-grid"></div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
